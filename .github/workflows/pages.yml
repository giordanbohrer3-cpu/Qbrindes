name: Testar e publicar

# O Pages publica a partir do branch gh-pages ("Deploy from a branch").
# A cada push na main, os testes rodam e, se passarem, a main é copiada para gh-pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  testar-e-publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes das regras (pedido e busca)
        run: node --test tests/*.test.js
      - name: Publicar a main no gh-pages
        run: git push --force origin HEAD:gh-pages
