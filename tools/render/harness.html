<script>
  // Math.random com semente fixa: o mesmo quadro sai igual em qualquer execução.
  (function () {
    var s = 0x9e3779b9 ^ Number(new URLSearchParams(location.search).get('semente') || 7);
    Math.random = function () {
      s |= 0; s = (s + 0x6d2b79f5) | 0;
      var t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  })();
</script>
